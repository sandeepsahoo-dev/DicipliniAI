name: Discipline OS CI/CD

on:
  push:
    branches:
      - main 

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check Node Version
        run: node --version