name: Dicipline OS CI/CD

on:
 push:
  branches:
   - main

jobs:
 backend-ci:
  runs-on: ubuntu-latest

  steps:
   -name: Checkout Reposortery
    uses: actions/checkout@v4

   -name: setup NodeJs
    uses: actions/setup-node@v4
    with:
     node-version: 22

   -name: check node version
    run: node --version
